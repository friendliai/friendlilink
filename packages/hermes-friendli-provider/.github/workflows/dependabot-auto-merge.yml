name: Dependabot auto-merge
# Auto-merge minor/patch bumps of github-actions refs on the mirror;
# majors open a normal PR. Injection-safe: only fetch-metadata outputs
# reach the shell, via env. Identical policy to friendlilink's
# .github/workflows/dependabot-auto-merge.yml (PR #58).
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        id: meta
      - if: >
          steps.meta.outputs.update-type != 'version-update:semver-major'
          && steps.meta.outputs.package-ecosystem == 'github_actions'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ github.token }}
