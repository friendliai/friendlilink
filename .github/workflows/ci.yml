name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: frlink (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No explicit version - pnpm/action-setup@v4 reads `packageManager`
        # from the root package.json (pnpm@9.15.0).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # Lockfiles are intentionally not committed; pnpm install resolves fresh.
      - run: pnpm install
      - run: pnpm exec prettier --check .
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

  dsh-plugin:
    name: "@friendliai/dsh-llm-friendli"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dsh-llm-friendli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # Lockfiles are intentionally not committed; pnpm install resolves fresh.
      - run: pnpm install
      # The package's own vitest.config.ts (added with the monorepo) pins test
      # discovery to this package, so the stock lint:all wrapper works here.
      - run: pnpm run lint:all
      - run: pnpm run build

  hermes-plugin:
    name: hermes-friendli-provider (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hermes-friendli-provider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The plugin's tests import the hermes-agent `providers` package, so a
      # hermes-agent checkout must be on sys.path. The plugin loader also
      # discovers bundled plugins by relative layout, hence the fixed dir name.
      # Clone with an absolute destination so the path is unambiguous: the
      # job's working-directory is packages/hermes-friendli-provider, so a
      # relative ../hermes-agent would land INSIDE packages/.
      - name: Clone hermes-agent
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent "${{ runner.temp }}/hermes-agent-checkout"
          # httpx + openai: the transport-kwargs tests drive the real SDK
          # client stack against an httpx.MockTransport. Pin to the same
          # major versions hermes-agent uses so the test combo matches a
          # real installation; hermes-agent's exact pin is in its own
          # pyproject.toml.
          pip install pytest 'httpx>=0.27,<1' 'openai>=1.50,<2'
      - name: Run plugin tests
        # The plugin's tests import the `providers` and `agent` packages from
        # a hermes-agent checkout; put that checkout on sys.path (locally the
        # venv's editable install supplies it, CI has no such install).
        run: |
          python -m pytest test_friendli_profile.py test_transport_kwargs.py -v
        env:
          HERMES_HOME: ${{ runner.temp }}/.hermes-home
          PYTHONPATH: ${{ runner.temp }}/hermes-agent-checkout
