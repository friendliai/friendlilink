name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: frlink (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # No explicit version - pnpm/action-setup@v4 reads `packageManager`
        # from the root package.json (pnpm@9.15.0).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # The CLI does not depend on the dsh adapter; its prepare belongs to the
      # dedicated dsh-plugin job, not the CLI verdict.
      # Lockfiles are intentionally not committed; pnpm resolves fresh.
      - run: pnpm --filter frlink install
      - run: pnpm exec prettier --check .
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

  dsh-plugin:
    name: "@friendliai/dsh-llm-friendli"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dsh-llm-friendli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # Lockfiles are intentionally not committed; pnpm install resolves fresh.
      - run: pnpm install
      # The package's own vitest.config.ts (added with the monorepo) pins test
      # discovery to this package, so the stock lint:all wrapper works here.
      - run: pnpm run lint:all
      - run: pnpm run build

  hermes-plugin:
    name: hermes-friendli-provider (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hermes-friendli-provider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.13"
      # The plugin's tests import the hermes-agent `providers` package, so a
      # hermes-agent checkout must be on sys.path. Use its locked Python 3.14
      # environment rather than a hand-picked subset of dependencies: Hermes
      # only supports 3.14 at runtime, and its transport now imports ruamel.
      - name: Clone and install hermes-agent
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent "${{ runner.temp }}/hermes-agent-checkout"
          cd "${{ runner.temp }}/hermes-agent-checkout"
          uv python install 3.14
          uv sync --locked --python 3.14 --group dev
      - name: Run plugin tests
        # The plugin's tests import the `providers` and `agent` packages from
        # the checkout; run them with the checkout's locked virtualenv.
        run: |
          "${{ runner.temp }}/hermes-agent-checkout/.venv/bin/python" -m pytest test_friendli_profile.py test_transport_kwargs.py -v
        env:
          HERMES_HOME: ${{ runner.temp }}/.hermes-home
          PYTHONPATH: ${{ runner.temp }}/hermes-agent-checkout
