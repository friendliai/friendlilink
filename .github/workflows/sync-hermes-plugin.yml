name: Sync hermes plugin mirror

# The hermes plugin's INSTALL CONTRACT is the GitHub repo
# friendliai/hermes-friendliai-provider (`hermes plugins install
# friendliai/hermes-friendliai-provider`). Source of truth is this repo's
# packages/hermes-friendli-provider/; this workflow copies changes to the
# mirror by opening a PR on it (via friendliai/actions/repo-migrator).
# Merging that PR publishes the change; the mirror's history stays
# append-only, so `hermes plugins update` (git pull --ff-only) keeps working
# for already-installed users.
#
# No untrusted input is interpolated into run: commands below — the only
# dynamic value used is GITHUB_SHA, a server-generated context value.

on:
  push:
    branches: [main]
    paths:
      - "packages/hermes-friendli-provider/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # repo-migrator copies the checkout's relative paths as-is, but the
      # install contract expects plugin.yaml at the MIRROR REPO ROOT. Isolate
      # the plugin directory at the workspace root first (rsync --delete
      # semantics come from repo-migrator's preserveFiles=false default).
      - name: Isolate plugin at workspace root
        run: |
          rsync -a packages/hermes-friendli-provider/ /tmp/plugin/
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a /tmp/plugin/ ./

      # First-party action pinned to the commit containing the fix for the
      # empty-excludes file-drop bug (".includes("") === true" filtered all
      # files). Refresh this SHA when updating to a newer repo-migrator commit.
      - name: Open sync PR on the mirror
        uses: friendliai/actions/repo-migrator@2f6d451548d2cbf58fb04a07a20c0276a27d73ed
        env:
          GITHUB_TOKEN: ${{ secrets.WEB_GITHUB_TOKEN }}
        with:
          target-repo: friendliai/hermes-friendliai-provider
          target-branch: main
          runner-label: hermes-plugin-sync
