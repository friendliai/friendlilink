name: Sync hermes plugin mirror

# Source of truth: packages/hermes-friendli-provider/. A fast-forward push
# publishes the plugin without rewriting installed users' git history.
on:
  push:
    branches: [main]
    paths:
      - "packages/hermes-friendli-provider/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-hermes-plugin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out mirror with its write deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: friendliai/hermes-friendliai-provider
          ref: main
          path: .mirror
          ssh-key: ${{ secrets.HERMES_MIRROR_DEPLOY_KEY }}
      - name: Sync plugin and push to mirror
        working-directory: .mirror
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rsync -a --delete --exclude='.git' \
            "$GITHUB_WORKSPACE/packages/hermes-friendli-provider/" ./
          git add -A
          if git diff --cached --quiet; then
            echo "Mirror already matches the plugin. Skipping push."
            exit 0
          fi

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "chore: sync plugin from friendlilink (${SOURCE_SHA:0:7})"
          git push origin HEAD:main
